name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run Validation
        run: make check

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Unit Tests
        run: make unit-test

  build:
    name: Build
    needs: [validation, unit-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Operator
        run: make build

  smoke-test:
    name: Smoke Test
    needs: [validation, unit-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up KinD
        uses: helm/kind-action@v1
        with:
          cluster_name: airo-cluster
          config: deploy/kind/kind-config.yaml

      - name: Build AIRO Image
        run: make image-build

      - name: Load AIRO Image
        run: make image-load

      - name: Build demo-api Image
        run: make demo-api-image-build

      - name: Load demo-api Image
        run: make demo-api-image-load

      - name: Deploy Monitoring
        run: make deploy-monitoring

      - name: Deploy AIRO
        run: make deploy-airo

      - name: Deploy Workload
        run: make deploy-workload

      - name: Run Smoke Test
        run: make smoke-test

  e2e-test:
    name: End-to-End Test
    needs: [validation, unit-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up KinD
        uses: helm/kind-action@v1
        with:
          cluster_name: airo-cluster
          config: deploy/kind/kind-config.yaml

      - name: Build AIRO Image
        run: make image-build

      - name: Load AIRO Image
        run: make image-load

      - name: Build demo-api Image
        run: make demo-api-image-build

      - name: Load demo-api Image
        run: make demo-api-image-load

      - name: Deploy Monitoring
        run: make deploy-monitoring

      - name: Deploy AIRO
        run: make deploy-airo

      - name: Deploy Workload
        run: make deploy-workload

      - name: Run Smoke Test
        run: make smoke-test

      - name: Run End-to-End Remediation Test
        run: make e2e-remediation
