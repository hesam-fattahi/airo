name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run CI validation
        run: make ci

  kind-integration-test:
    name: KinD Integration Test
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create KinD Multi-Node Cluster
        uses: helm/kind-action@v1.10.0
        with:
          config: deploy/kind-config.yaml
          cluster_name: airo-cluster

      - name: Run Kubernetes integration test
        run: make e2e-test