name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (Unit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: make verify

      - name: Check formatting
        run: make fmt-check

      - name: Run static analysis
        run: make vet

      - name: Run unit tests
        run: make test

      - name: Build AIRO
        run: make build

  e2e-k8s-test:
    name: E2E KinD Integration Test
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create KinD Multi-Node Cluster
        uses: helm/kind-action@v1.10.0
        with:
          config: deploy/kind-config.yaml
          cluster_name: airo-cluster

      - name: Verify Cluster Nodes
        run: kubectl get nodes

      - name: Build and Load payment-service Docker image
        run: |
          docker build -t payment-service:v1.0 -f examples/payment-service/Dockerfile .
          kind load docker-image payment-service:v1.0 --name airo-cluster

      - name: Build and Load AIRO Operator Docker image
        run: |
          docker build -t airo:latest .
          kind load docker-image airo:latest --name airo-cluster

      - name: Apply CRD and RBAC Manifests
        run: |
          kubectl apply -f config/crd/bases/
          kubectl apply -f config/rbac/
          kubectl apply -f deploy/monitoring/

      - name: Deploy Target Workload and AIRO Operator
        run: |
          kubectl apply -f examples/payment-service/k8s-deployment.yaml
          kubectl apply -f config/manager/deployment.yaml

      - name: Apply Sample RemediationPolicy
        run: kubectl apply -f config/samples/payment_api_policy.yaml

      - name: Wait for Operator and Policy Initialization
        run: |
          kubectl rollout status deployment/airo-operator --timeout=60s
          kubectl wait --for=jsonpath='{.status.phase}'=Healthy remediationpolicy/payment-api-policy --timeout=60s
