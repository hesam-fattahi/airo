          "targets": [
            {
              "expr": "100 * (((sum(rate(http_request_duration_seconds_bucket{app=\"demo-api\",le=\"0.05\"}[5m])) / sum(rate(http_request_duration_seconds_bucket{app=\"demo-api\",le=\"+Inf\"}[5m]))) - 0.99) / 0.01)",
