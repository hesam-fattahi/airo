            "defaults": {
              "decimals": 1,
              "mappings": [],
              "max": 100,
              "min": -100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 50
