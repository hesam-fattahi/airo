apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-airo-dashboard
  namespace: monitoring
data:
  airo-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": 1,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Percentage of requests completing within the 50ms SLO threshold. Target: 99%.",
          "fieldConfig": {
            "defaults": {
              "decimals": 3,
              "mappings": [],
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.99
                  },
                  {
                    "color": "green",
                    "value": 0.999
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.1",
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_bucket{app=\"demo-api\",le=\"0.05\"}[5m])) / sum(rate(http_request_duration_seconds_bucket{app=\"demo-api\",le=\"+Inf\"}[5m]))",
              "legendFormat": "SLI",
              "refId": "A"
            }
          ],
          "title": "Current SLI",
          "type": "stat"
        },
        {
