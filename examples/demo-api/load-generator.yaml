apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api-load-generator
  namespace: default
  labels:
    app: demo-api-load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api-load-generator
  template:
    metadata:
      labels:
        app: demo-api-load-generator
    spec:
      containers:
        - name: fortio
          image: fortio/fortio:1.75.2
          imagePullPolicy: IfNotPresent
          args:
            - load
            - -c
            - "1000"
            - -qps
            - "5000"
            - -t
            - "0"
            - http://demo-api.default.svc.cluster.local:8080/api/v1/message