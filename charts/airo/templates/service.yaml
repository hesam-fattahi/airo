apiVersion: v1
kind: Service
metadata:
  name: {{ include "airo.fullname" . }}
  labels:
    {{- include "airo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "airo.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP