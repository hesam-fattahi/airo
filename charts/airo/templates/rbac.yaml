{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "airo.serviceAccountName" . }}
  labels:
    {{- include "airo.labels" . | nindent 4 }}
---
{{- end }}

{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "airo.fullname" . }}
  labels:
    {{- include "airo.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - reliability.airo.io
    resources:
      - remediationpolicies
      - remediationpolicies/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "airo.fullname" . }}
  labels:
    {{- include "airo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "airo.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "airo.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}