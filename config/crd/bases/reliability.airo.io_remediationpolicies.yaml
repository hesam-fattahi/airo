---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: remediationpolicies.reliability.airo.io
spec:
  group: reliability.airo.io
  names:
    kind: RemediationPolicy
    listKind: RemediationPolicyList
    plural: remediationpolicies
    singular: remediationpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RemediationPolicy is the Schema for the remediationpolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RemediationPolicySpec defines the desired state of RemediationPolicy
            properties:
              detection:
                description: DetectionConfig defines independent multi-window burn
                  rate policies
                properties:
                  fastBurn:
                    description: BurnRateWindow configures short/long evaluation windows
                      and burn rate threshold for a policy
                    properties:
                      longWindow:
                        description: Long evaluation window (e.g. "1h" or "6h")
                        pattern: ^([0-9]+(s|m|h))+$
                        type: string
                      shortWindow:
                        description: Short evaluation window (e.g. "5m" or "30m")
                        pattern: ^([0-9]+(s|m|h))+$
                        type: string
                      threshold:
                        description: Burn rate threshold multiplier (e.g. 14.4 or
                          6.0)
                        minimum: 0
                        type: number
                    required:
                    - longWindow
                    - shortWindow
                    - threshold
                    type: object
                  slowBurn:
                    description: BurnRateWindow configures short/long evaluation windows
                      and burn rate threshold for a policy
                    properties:
                      longWindow:
                        description: Long evaluation window (e.g. "1h" or "6h")
                        pattern: ^([0-9]+(s|m|h))+$
                        type: string
                      shortWindow:
                        description: Short evaluation window (e.g. "5m" or "30m")
                        pattern: ^([0-9]+(s|m|h))+$
                        type: string
                      threshold:
                        description: Burn rate threshold multiplier (e.g. 14.4 or
                          6.0)
                        minimum: 0
                        type: number
                    required:
                    - longWindow
                    - shortWindow
                    - threshold
                    type: object
                required:
                - fastBurn
                - slowBurn
                type: object
              safety:
                description: SafetyConfig defines quorum checks and bounded remediation
                  budgets
                properties:
                  cooldownDuration:
                    description: Cooldown duration between remediations (e.g. "5m")
                    pattern: ^([0-9]+(s|m|h))+$
                    type: string
                  maxRemediationsPerWindow:
                    description: Maximum allowed remediations within the remediation
                      window
                    format: int32
                    minimum: 1
                    type: integer
                  minHealthyReplicas:
                    description: Minimum number of healthy replicas required to allow
                      remediation
                    format: int32
                    minimum: 1
                    type: integer
                  remediationWindow:
                    description: Time window for maximum remediation budget tracking
                      (e.g. "1h")
                    pattern: ^([0-9]+(s|m|h))+$
                    type: string
                required:
                - cooldownDuration
                - maxRemediationsPerWindow
                - minHealthyReplicas
                - remediationWindow
                type: object
              slo:
                description: SLOConfig defines the target SLO and latency thresholds
                properties:
                  latencyThresholdMs:
                    description: Latency threshold in milliseconds (e.g. 50 for 50ms)
                    format: int64
                    minimum: 1
                    type: integer
                  target:
                    description: Target ratio (e.g. 0.99 for 99.0% SLO)
                    maximum: 1
                    minimum: 0
                    type: number
                required:
                - latencyThresholdMs
                - target
                type: object
              targetRef:
                description: TargetRef defines the Kubernetes Deployment object to
                  monitor in the policy's namespace
                properties:
                  name:
                    description: Name of the target Deployment
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - detection
            - safety
            - slo
            - targetRef
            type: object
          status:
            description: RemediationPolicyStatus defines the observed state of RemediationPolicy
            properties:
              attributionConfidence:
                type: number
              attributionReason:
                type: string
              evaluationHoldoffUntil:
                format: date-time
                type: string
              fastBurnRate:
                type: number
              lastRemediationTime:
                format: date-time
                type: string
              message:
                type: string
              observedP99LatencyMs:
                type: number
              observedSLI:
                type: number
              phase:
                description: |-
                  RemediationPhase represents the current state machine phase.
                  Each phase transition is persisted atomically in CR status so reconciliation
                  can safely resume after controller restart or reconciliation interruption.
                type: string
              remediationCountInWindow:
                format: int32
                type: integer
              remediationWindowStart:
                format: date-time
                type: string
              slowBurnRate:
                type: number
              targetPodName:
                type: string
              targetPodUID:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
