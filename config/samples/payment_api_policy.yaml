apiVersion: reliability.airo.io/v1alpha1
kind: RemediationPolicy
metadata:
  name: payment-api-policy
  namespace: default
spec:
  targetRef:
    name: payment-api
  slo:
    target: 0.99
    latencyThresholdMs: 50
  detection:
    fastBurn:
      shortWindow: "5m"
      longWindow: "1h"
      threshold: 14.4
    slowBurn:
      shortWindow: "30m"
      longWindow: "6h"
      threshold: 6.0
  safety:
    minHealthyReplicas: 3
    cooldownDuration: "5m"
    maxRemediationsPerWindow: 2
    remediationWindow: "1h"
