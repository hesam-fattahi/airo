apiVersion: reliability.airo.io/v1alpha1
kind: RemediationPolicy
metadata:
  name: payment-api-policy
  namespace: default
spec:
  targetRef:
    kind: Deployment
    name: payment-api
  slo:
    target: 0.99
    latencyThresholdMs: 50
  detection:
    shortWindow: "5m"
    longWindow: "1h"
    fastBurnThreshold: 14.4
    slowBurnThreshold: 6.0
  safety:
    minHealthyReplicas: 3
    cooldownDuration: "5m"
    maxRemediationsPerWindow: 2
    remediationWindow: "1h"